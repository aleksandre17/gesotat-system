services:
  redis:
    image: redis:7.4.2-alpine
    container_name: geostat-redis
    command: ["redis-server", "--requirepass", "${GEOSTAT_REDIS_PASSWORD:?GEOSTAT_REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      GEOSTAT_REDIS_PASSWORD: ${GEOSTAT_REDIS_PASSWORD:?GEOSTAT_REDIS_PASSWORD is required}
    volumes:
      - geostat-redis-data:/data
    networks: [geostat-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${GEOSTAT_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: geostat-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
      - geostat-otel-data:/var/lib/otelcol
    networks: [geostat-net]
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: geostat-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - geostat-prometheus-data:/prometheus
    networks: [geostat-net]
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
  tempo:
    image: grafana/tempo:3.0.3
    container_name: geostat-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - geostat-tempo-data:/var/tempo
    networks: [geostat-net]
    restart: always
  grafana:
    image: grafana/grafana:12.1.1
    container_name: geostat-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - geostat-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [geostat-net]
    restart: always
    depends_on:
      prometheus: {condition: service_healthy}
      tempo: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  keycloak-db:
    image: postgres:16.4-alpine
    container_name: geostat-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER is required}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - geostat-keycloak-db-data:/var/lib/postgresql/data
    networks: [geostat-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${KEYCLOAK_DB_USER}\" -d \"$${KEYCLOAK_DB_NAME}\""]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: geostat-keycloak
    command: ["start", "--http-enabled=true", "--health-enabled=true", "--proxy-headers=xforwarded", "--import-realm"]
    depends_on:
      keycloak-db: {condition: service_healthy}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER is required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks: [geostat-net]
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  geostat-redis-data:
    name: infra_geostat-redis-data
  geostat-keycloak-db-data:
    name: infra_geostat-keycloak-db-data
  geostat-prometheus-data:
    name: infra_geostat-prometheus-data
  geostat-tempo-data:
    name: infra_geostat-tempo-data
  geostat-grafana-data:
    name: infra_geostat-grafana-data
  geostat-otel-data:
    name: infra_geostat-otel-data
networks:
  geostat-net:
    external: true
