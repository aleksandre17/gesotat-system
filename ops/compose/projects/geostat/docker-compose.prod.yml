# ============================================================
#  GeoStat System — Production Docker Compose
#  This project-level file is the single orchestration entrypoint. Service
#  overlays belong under ./services/<service>; they are never copied into the
#  product source tree or generated as competing per-service compose files.
# ============================================================

services:

  api:
    extends:
      file: services/api/docker-compose.base.yml
      service: api
    build:
      context: ../../../../platform/apps/geostat/backend/api
      dockerfile: Dockerfile
      args:
        IMAGE_REVISION: ${IMAGE_REVISION:?IMAGE_REVISION is required for a production build}
    container_name: geostat-api
    ports:
      - "${API_PORT:-8083}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -Xms512m -Xmx2g
    volumes:
      - ./logs:/app/logs
    networks:
      - geostat-net
    restart: always

  mobile:
    build:
      context: ../../../../platform/apps/geostat/backend/mobile
      dockerfile: Dockerfile
      args:
        IMAGE_REVISION: ${IMAGE_REVISION:?IMAGE_REVISION is required for a production build}
    container_name: geostat-mobile
    ports:
      - "${MOBILE_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_PRIMARY_JDBC_URL: ${DB_PRIMARY_URL}
      SPRING_DATASOURCE_PRIMARY_USERNAME: ${DB_PRIMARY_USER}
      SPRING_DATASOURCE_PRIMARY_PASSWORD: ${DB_PRIMARY_PASS}
      SPRING_DATASOURCE_SECONDARY_JDBC_URL: ${DB_SECONDARY_URL}
      SPRING_DATASOURCE_SECONDARY_USERNAME: ${DB_SECONDARY_USER}
      SPRING_DATASOURCE_SECONDARY_PASSWORD: ${DB_SECONDARY_PASS}
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -Xms256m -Xmx1g
    volumes:
      - ./logs:/app/logs
    networks:
      - geostat-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: geostat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - geostat-net
    restart: always

volumes:
  api-storage:
  api-uploads:
  minio-data:

networks:
  geostat-net:
    name: geostat-net
    external: true

