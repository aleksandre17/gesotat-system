# Governed file downloads for a site frontend that runs on the platform host.
#
# A visitor's browser cannot resolve an internal download hostname or trust an internal CA, and it
# should not have to: the site's own web server (this container, attached to the platform network)
# forwards the API-issued signed URL to the internal download endpoint. The browser only ever talks
# to the site's public origin.
#
#   browser:  GET https://<site>/files-download/<object path>?<signed query>
#   upstream: GET https://$GOVERNED_FILES_HOST/<object path>?<signed query>
#
# The signature covers the Host header, so the upstream Host is the download hostname the API signed
# for. The path and the query string are passed through unchanged; only signed GET/HEAD are forwarded.
# Include this file inside the site's `server { }` block. Values come from the environment through
# the nginx image's envsubst templates: GOVERNED_FILES_HOST, GOVERNED_FILES_CA (path of the mounted
# internal CA certificate).

location /files-download/ {
  limit_except GET HEAD { deny all; }
  if ($args !~ "(^|&)X-Amz-Signature=") { return 403; }

  proxy_pass https://${GOVERNED_FILES_HOST}/;
  proxy_http_version 1.1;
  proxy_set_header Host ${GOVERNED_FILES_HOST};
  proxy_ssl_server_name on;
  proxy_ssl_name ${GOVERNED_FILES_HOST};
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate ${GOVERNED_FILES_CA};
  proxy_ssl_protocols TLSv1.2 TLSv1.3;
  proxy_buffering off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "private, no-store" always;
}
