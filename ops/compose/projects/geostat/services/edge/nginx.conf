events {}

http {
  server_tokens off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://geostat-api:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # External OIDC authority for the internal production boundary. Keycloak
    # remains private on geostat-net; only its TLS-backed issuer is published.
    location /realms/ {
      proxy_pass https://geostat-keycloak:8443;
      proxy_ssl_verify off;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://host.docker.internal:5175;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # Governed artifact distribution (STORAGE_PUBLIC_ENDPOINT=https://files.geostat.internal).
  # Serves only API-issued presigned GETs: buckets stay private, so an unsigned or
  # expired request is refused by MinIO itself. SigV4 signs the Host header, so it
  # is passed through unchanged and the path is never rewritten.
  # This hostname has its own certificate (leaf + internal CA chain), so the
  # trust anchor of the other server blocks is never re-issued and no existing
  # client loses trust when a download hostname is added or rotated.
  server {
    listen 443 ssl;
    server_name files.geostat.internal;

    ssl_certificate /etc/nginx/tls/files.crt;
    ssl_certificate_key /etc/nginx/tls/files.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
      limit_except GET HEAD { deny all; }
      if ($args !~ "(^|&)X-Amz-Signature=") { return 403; }
      proxy_pass http://minio:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
    }
  }
}
