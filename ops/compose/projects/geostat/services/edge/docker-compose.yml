# Internal production HTTPS edge for the GeoStat project only.
# This file never shares ports, volumes, or containers with other projects.
services:
  geostat-edge:
    image: nginx:1.29.1-alpine
    container_name: geostat-edge
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${GEOSTAT_TLS_DIR:?GEOSTAT_TLS_DIR is required}/tls.crt:/etc/nginx/tls/tls.crt:ro
      - ${GEOSTAT_TLS_DIR:?GEOSTAT_TLS_DIR is required}/tls.key:/etc/nginx/tls/tls.key:ro
    networks:
      geostat-net:
        aliases:
          - auth.geostat.internal
          - api.geostat.internal
          - geostat.internal
          - files.geostat.internal
      geostat-edge-host: {}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  geostat-net:
    external: true
  geostat-edge-host:
    name: geostat-edge-host
