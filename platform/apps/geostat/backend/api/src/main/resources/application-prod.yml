## ─── API: Production Profile ────────────────────────────────
## Activated with: SPRING_PROFILES_ACTIVE=prod

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

platform:
  serving-cache:
    enabled: ${PLATFORM_SERVING_CACHE_ENABLED:true}
  legacy:
    dynamic-pages:
      enabled: ${PLATFORM_LEGACY_DYNAMIC_PAGES_ENABLED:false}

logging:
  file:
    path: /app/logs
  level:
    root: WARN
    org.base.api: INFO
    org.base.mobile: INFO
    org.springframework: WARN
    org.hibernate: WARN
