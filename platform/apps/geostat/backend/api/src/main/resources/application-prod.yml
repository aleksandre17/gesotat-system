## ─── API: Production Profile ────────────────────────────────
## Activated with: SPRING_PROFILES_ACTIVE=prod

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

platform:
  oidc:
    enabled: ${PLATFORM_OIDC_ENABLED:false}
    issuer-uri: ${OIDC_ISSUER_URL:}
    audience: ${OIDC_AUDIENCE:geostat-api}
    roles-claim: ${OIDC_ROLES_CLAIM:realm_access.roles}
    tenant-claim: ${OIDC_TENANT_CLAIM:tenant_id}
    role-authority-map: ${OIDC_ROLE_AUTHORITY_MAP:contract.read=READ_RESOURCE;contract.write=WRITE_RESOURCE;ingest.execute=WRITE_RESOURCE;quality.approve=PUBLISH_RESOURCE;publish.execute=PUBLISH_RESOURCE;raw.read=READ_RESOURCE;admin=ADMIN}
  serving-cache:
    enabled: ${PLATFORM_SERVING_CACHE_ENABLED:true}
  legacy:
    dynamic-pages:
      enabled: ${PLATFORM_LEGACY_DYNAMIC_PAGES_ENABLED:false}

logging:
  file:
    path: /app/logs
  level:
    root: WARN
    org.base.api: INFO
    org.base.mobile: INFO
    org.springframework: WARN
    org.hibernate: WARN
